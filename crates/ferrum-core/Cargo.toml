[package]
name = "ferrum-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Ferrum2D core engine crate"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
rapier3d = { version = "=0.36.1", path = "vendor/rapier3d", features = ["enhanced-determinism", "serde-serialize"] }
serde = { version = "=1.0.229", features = ["derive", "rc"] }
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }

# glam's `libm` feature uses this crate. The vendored copy keeps the same
# version and only routes stable wasm32 square root to the hardware instruction.
[patch.crates-io]
libm = { path = "vendor/libm" }

[package.metadata.wasm-pack.profile.release]
# Keep large single-caller physics functions separate for the browser's first update.
wasm-opt = ["-O", "--one-caller-inline-max-function-size=50"]
