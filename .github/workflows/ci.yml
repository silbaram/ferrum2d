name: CI

on:
  workflow_dispatch:
    inputs:
      consumer_smoke:
        description: 'Run package consumer smoke'
        required: false
        default: false
        type: boolean
      extended_browser_smoke:
        description: 'Run extended browser smoke matrix'
        required: false
        default: false
        type: boolean

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install desktop Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Check Ferrum core Rust formatting
        run: cargo fmt --manifest-path crates/ferrum-core/Cargo.toml --all -- --check

      - name: Lint Ferrum core Rust
        run: cargo clippy --manifest-path crates/ferrum-core/Cargo.toml --all-targets -- -D warnings

      - name: Check Studio desktop Rust formatting
        run: cargo fmt --manifest-path apps/studio-desktop/src-tauri/Cargo.toml --all -- --check

      - name: Lint Studio desktop Rust
        run: cargo clippy --manifest-path apps/studio-desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Studio desktop save contracts
        run: cargo test --manifest-path apps/studio-desktop/src-tauri/Cargo.toml

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm 10.8.0
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.0
          run_install: false

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright Chromium and system libraries
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Release candidate metadata guard
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/ferrum-web-v* ]]; then
            node scripts/package/check-release-candidate.mjs --version "${RELEASE_REF#ferrum-web-v}" --tag "$RELEASE_REF"
          else
            pnpm release:candidate-check
          fi

      - name: Public API surface guard
        run: pnpm validate:public-api-surface

      - name: Placement document save contracts
        run: pnpm smoke:placement-document-store

      - name: Placement project scene discovery contracts
        run: pnpm test:placement-scenes

      - name: Engine and editor update contracts
        run: pnpm test:updates

      - name: Sprite normal tooling and animation contracts
        run: pnpm test:sprite-normals-tool

      - name: Rust tests
        run: cargo test --manifest-path crates/ferrum-core/Cargo.toml

      - name: Rust test harness guard
        run: pnpm validate:rust-test-harness

      - name: Physics smoke tests
        run: pnpm smoke:physics

      - name: Runtime budget profile gate
        run: pnpm smoke:runtime-budgets

      - name: Runtime budget productization guard
        run: pnpm validate:runtime-budget-product

      - name: Mass object stress smoke
        run: pnpm smoke:mass-objects

      - name: Top-down browser mass object smoke
        run: pnpm smoke:topdown-mass-objects

      - name: Top-down browser tilemap budget smoke
        run: pnpm smoke:topdown-tilemap-budget

      - name: Build wasm package
        run: wasm-pack build crates/ferrum-core --target web --out-dir
          ../../packages/ferrum-web/pkg

      - name: Build Studio Kit declarations for type checking
        run: pnpm --filter @ferrum2d/studio-kit build

      - name: Lint TypeScript packages
        run: pnpm lint

      - name: Example demo harness guard
        run: pnpm report:example-demo-harness

      - name: Test packages
        run: pnpm test

      - name: Build TypeScript packages
        run: pnpm build

      - name: Placement workspace browser smoke
        run: |
          pnpm test:placement-point-shadows
          node tests/smoke/browser-render-smoke.mjs --mode=studio apps/studio/dist

      - name: Placement save and layer state browser smoke
        env:
          VITE_FERRUM_STUDIO_SAVE: "true"
        run: |
          pnpm --filter @ferrum2d/studio exec vite build --base=./ --outDir "$RUNNER_TEMP/studio-save"
          node tests/smoke/browser-render-smoke.mjs --mode=studio-save "$RUNNER_TEMP/studio-save"

      - name: HD-2D authoring workspace browser smoke
        run: node tests/smoke/browser-render-smoke.mjs --mode=placement-spatial-workspace apps/studio/dist

      - name: Blender HD-2D village browser smoke
        # Includes camera pitch, working-plane placement, grid and viewport coverage at DPR 1/2.
        run: node tests/smoke/placement-village-smoke.mjs

      - name: Placement camera, grid, locale, layer and command contracts
        run: pnpm test:placement-camera && pnpm test:placement-grid && pnpm test:placement-locale && pnpm test:placement-layers && pnpm test:placement-commands && pnpm test:placement-layouts && pnpm test:placement-inspector && pnpm test:placement-asset-usage && pnpm test:placement-asset-cleanup

      - name: Packed input context browser smoke
        run: pnpm smoke:input-context

      - name: Data Scene gameplay packed Wasm smoke
        run: pnpm smoke:data-scene-gameplay

      - name: Data Scene packed runtime browser smoke
        run: pnpm smoke:data-scene

      - name: Spatial Scene browser smoke
        run: pnpm smoke:spatial-scene

      - name: Spatial WebGPU geometry/models offscreen and pre-context fallback
        run: pnpm smoke:spatial-webgpu-offscreen

      - name: WebGPU recovery with GPU timing and resource diagnostics
        run: pnpm smoke:webgpu-recovery

      - name: Imported Tiled and LDtk whole map authoring
        run: pnpm smoke:tile-map

      - name: Asset revision cleanup and import diagnostics
        run: pnpm smoke:aseprite-assets

      - name: Trimmed sprite restoration and native source preservation
        run: pnpm smoke:aseprite-trim

      - name: Slice metadata and explicit sprite origin authoring
        run: pnpm smoke:aseprite-slices

      - name: Upload slice origin evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-slices
          path: artifacts/aseprite-slices
          if-no-files-found: ignore

      - name: Upload trim restoration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-trim
          path: artifacts/aseprite-trim
          if-no-files-found: ignore

      - name: Ordinary 2D sprite normals on WebGL2 and WebGPU
        run: pnpm smoke:sprite-normal-2d

      - name: Flat lighting composition contracts on WebGL2 and WebGPU
        run: pnpm smoke:flat-lighting-contract

      - name: Flat lit receivers on WebGL2 and WebGPU
        run: pnpm smoke:flat-lit

      - name: Upload flat lighting verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flat-lighting
          path: |
            artifacts/flat-lighting-contract
            artifacts/flat-lit-m2a
          if-no-files-found: ignore

      - name: Engine Playground movement, physics, lighting and camera
        run: pnpm smoke:engine-playground

      - name: Independent engine feature examples on WebGL2 and WebGPU
        run: node tests/smoke/feature-examples-smoke.mjs

      - name: Example catalog, unified UI and application navigation
        run: pnpm smoke:example-suite

      - name: Upload example suite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-suite
          path: artifacts/example-suite
          if-no-files-found: ignore

      - name: Upload feature example evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-examples
          path: artifacts/feature-examples
          if-no-files-found: ignore

      - name: Upload Engine Playground evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-playground
          path: artifacts/engine-playground
          if-no-files-found: ignore

      - name: Nine-slice native geometry and WebGL2/WebGPU pixel parity
        run: pnpm smoke:sprite-nine-slice

      - name: Upload nine-slice evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprite-nine-slice
          path: artifacts/pixel-tools-and-demo/nine-slice/runtime
          if-no-files-found: ignore

      - name: Sprite palette RGB parity, native scene and recovery
        run: pnpm smoke:sprite-palette

      - name: Pixel postprocess parity, virtual pixels and recovery
        run: pnpm smoke:pixel-postprocess

      - name: Pixel art showcase movement, collection and visual controls
        run: pnpm smoke:pixel-showcase

      - name: Upload pixel showcase evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-showcase
          path: artifacts/pixel-showcase
          if-no-files-found: ignore

      - name: Upload pixel postprocess evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-postprocess
          path: artifacts/pixel-postprocess
          if-no-files-found: ignore

      - name: Upload sprite palette evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprite-palette
          path: artifacts/sprite-palette
          if-no-files-found: ignore

      - name: Built-in pixel creation, source export and fresh game rendering
        run: pnpm smoke:pixel-authoring

      - name: Native pixel source storage and fresh game roundtrip
        run: pnpm smoke:pixel-project

      - name: 64-frame pixel editing capacity and native save compatibility
        run: pnpm smoke:pixel-capacity

      - name: Upload pixel capacity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-editor-capacity
          path: artifacts/pixel-editor-capacity
          if-no-files-found: ignore

      - name: Recoverable project asset catalog cleanup
        run: node tests/smoke/aseprite-project-smoke.mjs --cleanup

      - name: Upload project catalog cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-asset-cleanup
          path: |
            artifacts/project-asset-cleanup/browser/verification.json
            artifacts/project-asset-cleanup/browser/run-*/*.png
            artifacts/project-asset-cleanup/browser/run-*/cleanup-plan.json
            artifacts/project-asset-cleanup/browser/run-*/rust-build.log
          if-no-files-found: ignore

      - name: Upload pixel and 2D material evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-pixel-project
          path: |
            artifacts/pixel-normal-2d/runtime/verification.json
            artifacts/pixel-normal-2d/runtime/run-*/verification.json
            artifacts/pixel-project/verification.json
            artifacts/pixel-project/run-*/verification.json
            artifacts/pixel-project/run-*/*.png
            artifacts/pixel-project/run-*/*.pixel.json
            artifacts/pixel-project/run-*/rust-build.log
          if-no-files-found: ignore

      - name: Native tile map source storage and fresh game roundtrip
        run: |
          cargo test --manifest-path apps/studio-desktop/src-tauri/Cargo.toml --no-default-features --no-run --locked
          pnpm smoke:tile-project

      - name: Upload native tile map evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-tile-map
          path: |
            artifacts/native-tile-assets/verification.json
            artifacts/native-tile-assets/run-*/*.png
          if-no-files-found: ignore

      - name: Autotile bake, preview, Data Scene budget and native roundtrip
        run: pnpm smoke:tile-autotile

      - name: Upload autotile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tile-autotile
          path: artifacts/tile-autotile
          if-no-files-found: ignore

      - name: Tile animation, fixed collision and native roundtrip
        run: pnpm smoke:tile-animation

      - name: Upload tile animation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tile-animation
          path: artifacts/tile-animation
          if-no-files-found: ignore

      - name: Real village combat, audio, ramp and LOD quality evidence
        run: pnpm smoke:village-game-quality

      - name: Upload village game quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: village-game-quality
          path: |
            artifacts/village-game-quality/run-*/report.json
            artifacts/village-game-quality/run-*/*.png
          if-no-files-found: ignore

      - name: Upload spatial WebGPU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spatial-webgpu
          path: |
            artifacts/hd2d-static-model/spatial-webgpu/run-*/report.json
            artifacts/hd2d-static-model/spatial-webgpu/run-*/*.png
          if-no-files-found: ignore

      - name: Verify native HD-2D combat, input, checkpoints, prefabs, multi-floor AI, crowd, scheduler, movement, melee/dash, actor spawn and projectile visuals
        run: pnpm smoke:hd2d-combat

      - name: Upload HD-2D combat evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hd2d-combat
          path: |
            artifacts/hd2d-static-model/combat/run-*/report.json
            artifacts/hd2d-static-model/combat/run-*/*-enemies*.json
            artifacts/hd2d-static-model/combat/run-*/prefab-*.png
            artifacts/hd2d-static-model/combat/run-*/movement-*.png
            artifacts/hd2d-static-model/combat/run-*/actions-*.png
            artifacts/hd2d-static-model/combat/run-*/spawn-*.png
            artifacts/hd2d-static-model/combat/run-*/visuals-*.png
          if-no-files-found: ignore

      - name: Data Scene animation projection and sun browser smoke
        run: pnpm smoke:data-scene-presentation

      - name: Native sprite timing directions events and save browser smoke
        run: pnpm smoke:sprite-animation-runtime

      - name: Upload runtime animation verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-animation
          path: artifacts/runtime-animation
          if-no-files-found: ignore

      - name: RenderTexture browser smoke
        run: pnpm smoke:render-texture

      - name: Color management browser smoke
        run: pnpm smoke:color-management

      - name: Flat 2D pixel-perfect rendering and Game Preview smoke
        run: pnpm smoke:flat-pixel-perfect

      - name: Atlas PNG extrusion and renderer boundary smoke
        run: pnpm smoke:atlas-extrusion

      - name: Upload atlas extrusion verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-extrusion
          path: artifacts/atlas-extrusion
          if-no-files-found: ignore

      - name: Upload pixel-perfect verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flat-pixel-perfect
          path: artifacts/flat-pixel-perfect
          if-no-files-found: ignore

      - name: GPU resource lifecycle browser smoke
        run: pnpm smoke:gpu-resources

      - name: Asset loading concurrency and cancellation smoke
        run: pnpm smoke:asset-loading

      - name: Spatial audio output and native binding smoke
        run: pnpm smoke:spatial-audio

      - name: KTX2 compressed texture smoke
        run: pnpm smoke:ktx2

      - name: Shader preparation smoke
        run: pnpm smoke:shader-preparation

      - name: Data scene authoring sample validation
        run: pnpm validate:data-scene-authoring

      - name: Package artifact checks
        run: pnpm package:check

      - name: Gameplay authoring report
        run: pnpm validate:gameplay-authoring:report

      - name: Gameplay replay report
        run: pnpm smoke:gameplay-replay:report

      - name: Gameplay report artifact validation
        run: pnpm validate:gameplay-report-artifacts

      - name: Consumer smoke report validator smoke
        run: pnpm smoke:consumer-smoke-report

      - name: Asset pipeline smoke
        run: pnpm smoke:asset-pipeline

      - name: GitHub Release generator contracts
        run: pnpm test:github-release

      - name: Create-game template catalog smoke
        run: pnpm smoke:create-game-template-catalog

      - name: Create-game template report smoke
        run: pnpm smoke:create-game-template-reports

      - name: Topdown template replay report smoke
        run: pnpm smoke:topdown-template-replay-report

  consumer-smoke:
    runs-on: ubuntu-latest
    needs: validate
    if: startsWith(github.ref, 'refs/tags/ferrum-web-v') || (github.event_name == 'workflow_dispatch' && inputs.consumer_smoke)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm 10.8.0
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.0
          run_install: false

      - name: Install dependencies
        run: pnpm install

      - name: Package consumer smoke
        id: package_consumer_smoke
        run: pnpm package:consumer-smoke -- --artifact-dir artifacts/consumer-smoke

      - name: Validate consumer smoke report
        if: always()
        env:
          EXPECT_STATUS: ${{ steps.package_consumer_smoke.outcome == 'success' && 'passed' || 'failed' }}
        run: pnpm validate:consumer-smoke-report -- --expect-status "$EXPECT_STATUS"

      - name: Upload consumer smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-smoke-artifacts
          path: artifacts/consumer-smoke
          if-no-files-found: ignore

  extended-browser-smoke:
    runs-on: ubuntu-latest
    needs: validate
    if: startsWith(github.ref, 'refs/tags/ferrum-web-v') || (github.event_name == 'workflow_dispatch' && inputs.extended_browser_smoke)
    strategy:
      fail-fast: false
      matrix:
        include:
          - smoke: smoke:preload
            artifact: preload
          - smoke: smoke:mobile-input
            artifact: mobile-input
          - smoke: smoke:lighting
            artifact: lighting
          - smoke: smoke:lighting-webgpu
            artifact: lighting-webgpu
          - smoke: smoke:material
            artifact: material
          - smoke: smoke:material-webgpu
            artifact: material-webgpu
          - smoke: smoke:camera-postprocess
            artifact: camera-postprocess
          - smoke: smoke:particle-vfx
            artifact: particle-vfx
          - smoke: smoke:topdown
            artifact: topdown
          - smoke: smoke:topdown-budget
            artifact: topdown-budget
          - smoke: smoke:topdown-save-load
            artifact: topdown-save-load
          - smoke: smoke:topdown-hd2d
            artifact: topdown-hd2d
          - smoke: smoke:destructible-terrain-browser
            artifact: destructible-terrain-browser
          - smoke: smoke:breakout-effects
            artifact: breakout-effects
          - smoke: smoke:breakout-budget
            artifact: breakout-budget
          - smoke: smoke:platformer-effects
            artifact: platformer-effects
          - smoke: smoke:platformer-budget
            artifact: platformer-budget
          - smoke: smoke:physics-sandbox
            artifact: physics-sandbox
          - smoke: smoke:physics-sandbox-budget
            artifact: physics-sandbox-budget
          - smoke: smoke:physics-demo-suite
            artifact: physics-demo-suite

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm 10.8.0
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.0
          run_install: false

      - name: Install dependencies
        run: pnpm install

      - name: Extended browser smoke
        env:
          FERRUM_BROWSER_SMOKE_TIMEOUT_MS: 30000
          FERRUM_BROWSER_SMOKE_BUDGET_ARTIFACT_DIR: artifacts/browser-smoke-budgets
        run: pnpm ${{ matrix.smoke }}

      - name: Upload browser smoke budget artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extended-browser-smoke-${{ matrix.artifact }}
          path: artifacts/browser-smoke-budgets
          if-no-files-found: ignore
