name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      consumer_smoke:
        description: 'Run package consumer smoke'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Rust 1.100 adds Clippy lints that fail -D warnings.
  # Bump after fixing the new lints and checking rustfmt, Clippy, and Wasm.
  CI_RUST_TOOLCHAIN: '1.97.1'

jobs:
  # PR checks run as four parallel jobs, so a run takes as long as the slowest job.
  validate-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CI_RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache Rust build dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/ferrum-core -> target
            crates/ferrum-core/vendor/rapier3d -> target
            crates/ferrum-core/vendor/parry3d -> target
          cache-on-failure: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Setup pnpm 10.8.0
        uses: pnpm/action-setup@v5
        with:
          version: 10.8.0
          run_install: false

      - name: Install dependencies
        run: pnpm install

      - name: Check Ferrum core Rust formatting
        run: cargo fmt --manifest-path crates/ferrum-core/Cargo.toml --all -- --check

      - name: Lint Ferrum core Rust
        run: cargo clippy --manifest-path crates/ferrum-core/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path crates/ferrum-core/Cargo.toml

      - name: Native physics stored-reference contracts
        run: pnpm test:physics3d-storage

      - name: Native physics snapshot portability golden
        run: pnpm test:physics3d-portability

      - name: Native physics near-origin query contracts
        run: pnpm test:physics3d-queries

      - name: Rust test harness guard
        run: pnpm validate:rust-test-harness

      - name: Physics smoke tests
        run: pnpm smoke:physics

      - name: Runtime budget profile gate
        run: pnpm smoke:runtime-budgets

      - name: Runtime budget productization guard
        run: pnpm validate:runtime-budget-product

      - name: Mass object stress smoke
        run: pnpm smoke:mass-objects

  validate-wasi:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CI_RUST_TOOLCHAIN }}
          targets: wasm32-wasip1

      - name: Cache Rust build dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/ferrum-core -> target
          cache-on-failure: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Setup pnpm 10.8.0
        uses: pnpm/action-setup@v5
        with:
          version: 10.8.0
          run_install: false

      - name: Install dependencies
        run: pnpm install

      - name: Native WASI runner contracts
        run: node --test tests/smoke/native-wasi-runner.test.mjs

      - name: Rust-only WASI unit and integration tests
        run: pnpm test:rust-wasi

  validate-studio-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CI_RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache Rust build dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/studio-desktop/src-tauri -> target
          cache-on-failure: true

      - name: Install desktop Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Check Studio desktop Rust formatting
        run: cargo fmt --manifest-path apps/studio-desktop/src-tauri/Cargo.toml --all -- --check

      - name: Lint Studio desktop Rust
        run: cargo clippy --manifest-path apps/studio-desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Studio desktop save contracts
        run: cargo test --manifest-path apps/studio-desktop/src-tauri/Cargo.toml

      - name: Native tile map source storage build
        run: cargo test --manifest-path apps/studio-desktop/src-tauri/Cargo.toml --no-default-features --no-run --locked

  validate:
    # Playwright 1.60 supports installing Chromium dependencies on Ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CI_RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      - name: Cache Rust build dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/ferrum-core -> target
          cache-on-failure: true

      - name: Install wasm-pack
        run: |
          if command -v wasm-pack >/dev/null 2>&1; then
            wasm-pack --version
          else
            cargo install wasm-pack
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Setup pnpm 10.8.0
        uses: pnpm/action-setup@v5
        with:
          version: 10.8.0
          run_install: false

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright Chromium and system libraries
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Release candidate metadata guard
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/ferrum-web-v* ]]; then
            node scripts/package/check-release-candidate.mjs --version "${RELEASE_REF#ferrum-web-v}" --tag "$RELEASE_REF"
          else
            pnpm release:candidate-check
          fi

      - name: Public API surface guard
        run: pnpm validate:public-api-surface

      - name: Placement document save contracts
        run: pnpm smoke:placement-document-store

      - name: Placement project scene discovery contracts
        run: pnpm test:placement-scenes

      - name: Engine and editor update contracts
        run: pnpm test:updates

      - name: Sprite normal tooling and animation contracts
        run: pnpm test:sprite-normals-tool

      - name: Build wasm package
        run: pnpm build:wasm

      # test:web builds ferrum-web before running the SDK tests.
      - name: Test Web packages
        run: pnpm test:web

      # The Studio build handles Studio Kit. Reuse the SDK built by test:web.
      - name: Build remaining TypeScript packages
        run: |
          pnpm pack:textures:if-present
          pnpm -r --filter './packages/*' --filter './apps/*' --filter './examples/*' \
            --filter '!@ferrum2d/ferrum-web' --filter '!@ferrum2d/studio-kit' build

      - name: Lint TypeScript packages
        run: pnpm lint

      - name: Example demo harness guard
        run: pnpm report:example-demo-harness

      # Both probes consume the common package and example builds.
      - name: Top-down browser mass object smoke
        timeout-minutes: 10
        run: node tests/smoke/browser-render-smoke.mjs --budget --mode=topdown-mass-objects examples/topdown-shooter/dist

      - name: Top-down browser tilemap budget smoke
        timeout-minutes: 10
        run: node tests/smoke/browser-render-smoke.mjs --budget --mode=topdown-tilemap-budget examples/topdown-shooter/dist

      # Packs the package built above for limits, rotation, and terrain acceptance.
      - name: Native physics SDK file acceptance
        timeout-minutes: 10
        run: pnpm smoke:physics-sdk-integration

      - name: Upload native physics SDK file acceptance report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-physics-sdk-file-acceptance
          path: artifacts/physics-3d/sdk-integration-acceptance/
          if-no-files-found: ignore

      - name: Build Studio smoke variants
        run: |
          VITE_FERRUM_STUDIO_SAVE=true pnpm --filter @ferrum2d/studio exec vite build --base=./ --outDir "$RUNNER_TEMP/studio-save"
          VITE_FERRUM_STUDIO_SAVE=false pnpm --filter @ferrum2d/studio exec vite build --base=./ --mode test --outDir "$RUNNER_TEMP/studio-test"
          VITE_FERRUM_STUDIO_SAVE=true pnpm --filter @ferrum2d/studio exec vite build --base=./ --mode test --outDir "$RUNNER_TEMP/studio-test-save"
          printf 'FERRUM_STUDIO_TEST_DIST=%s\nFERRUM_STUDIO_SAVE_TEST_DIST=%s\n' \
            "$RUNNER_TEMP/studio-test" "$RUNNER_TEMP/studio-test-save" >> "$GITHUB_ENV"

      - name: Placement point shadow contracts
        run: pnpm test:placement-point-shadows

      - name: Placement save and layer state browser smoke
        timeout-minutes: 10
        run: |
          node tests/smoke/browser-render-smoke.mjs --mode=studio-save "$RUNNER_TEMP/studio-save"
          FERRUM_NATIVE_TEMPLATE_STUDIO_ROOT="$RUNNER_TEMP/studio-save" node tests/smoke/native-template-studio-smoke.mjs

      - name: Upload native template Studio report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-template-studio
          path: artifacts/physics-3d/goal-closure/studio-native-authoring/browser/
          if-no-files-found: ignore

      - name: Placement camera, grid, locale, layer and command contracts
        run: pnpm test:placement-camera && pnpm test:placement-grid && pnpm test:placement-locale && pnpm test:placement-layers && pnpm test:placement-commands && pnpm test:placement-layouts && pnpm test:placement-inspector && pnpm test:placement-asset-usage && pnpm test:placement-asset-cleanup && pnpm test:placement-flat-lighting

      - name: Packed input context browser smoke
        timeout-minutes: 10
        run: node tests/smoke/input-context-browser-smoke.mjs

      - name: Data Scene gameplay packed Wasm smoke
        run: node tests/smoke/data-scene-gameplay-smoke.mjs

      - name: Data Scene packed runtime browser smoke
        timeout-minutes: 10
        run: node tests/smoke/data-scene-browser-smoke.mjs

      - name: Spatial WebGPU report contracts
        run: |
          pnpm test:spatial-light-probes-report
          pnpm test:spatial-light-shafts-report
          pnpm test:spatial-height-fog-report
          pnpm test:spatial-point-pcss-report
          pnpm test:spatial-sun-pcss-report
          pnpm test:spatial-point-shadows-report
          pnpm test:spatial-light-selection-report
          pnpm test:spatial-bloom-report

      - name: Tile asset, autotile and tile animation contracts
        run: pnpm test:tile-assets

      - name: Trimmed sprite contracts
        run: pnpm test:aseprite-trim

      - name: Sprite slice contracts
        run: pnpm test:aseprite-slices

      - name: Example site build contracts
        run: pnpm test:pages-build

      - name: Example catalog and browser-free example contracts
        run: |
          pnpm validate:example-catalog
          pnpm test:browser-smoke-node-checks

      - name: Pixel postprocess contracts
        run: node --test tests/smoke/pixel-postprocess-contract.test.mjs

      - name: Built-in pixel authoring contracts
        run: pnpm test:pixel-authoring

      - name: Native pixel source storage contracts
        run: pnpm test:native-normal-project

      - name: Pixel editing capacity profile
        run: pnpm profile:pixel-capacity

      - name: Native sprite runtime report contracts
        run: node --test tests/smoke/sprite-animation-runtime-report.test.mjs

      - name: Atlas PNG extrusion contracts
        run: node --test tests/smoke/atlas-extrusion.test.mjs

      - name: Data scene authoring sample validation
        run: node scripts/validate/validate-data-scene-authoring-sample.mjs docs/engine/samples/data-scene-minimum.scene-authoring.json

      - name: Wasm dependency notice generator contracts
        run: node --test tests/smoke/wasm-license-notices.test.mjs

      - name: Package artifact checks
        run: |
          node --test tests/smoke/native-wasm-source-identity.test.mjs
          node scripts/package/check-package-files.mjs --require-wasm-pkg --verify-pack
          node --test tests/smoke/ferrum-web-public-types.test.mjs
          node scripts/package/check-studio-kit-package.mjs --verify-pack
          node scripts/package/check-create-game-package.mjs --verify-pack --skip-build
          node scripts/package/check-agents-package.mjs --verify-pack

      - name: Gameplay authoring report
        run: node scripts/validate/gameplay-authoring-dry-run.mjs --artifact-dir artifacts/gameplay-authoring-dry-run

      - name: Gameplay replay report
        run: node tests/smoke/gameplay-replay-smoke.mjs --artifact-dir artifacts/gameplay-replay-smoke

      - name: Gameplay report artifact validation
        run: pnpm validate:gameplay-report-artifacts

      - name: Consumer smoke report validator smoke
        run: pnpm smoke:consumer-smoke-report

      - name: Asset pipeline smoke
        run: node tests/smoke/asset-pipeline-e2e-smoke.mjs

      - name: GitHub Release generator contracts
        run: pnpm test:github-release

      - name: Create-game template catalog smoke
        run: pnpm smoke:create-game-template-catalog

      - name: Create-game template report smoke
        run: node tests/smoke/create-game-template-report-envelope-smoke.mjs

      - name: Topdown template replay report smoke
        run: node tests/smoke/topdown-template-replay-report-smoke.mjs

  consumer-smoke:
    runs-on: ubuntu-latest
    needs: [validate-rust, validate-wasi, validate-studio-desktop, validate]
    if: startsWith(github.ref, 'refs/tags/ferrum-web-v') || (github.event_name == 'workflow_dispatch' && inputs.consumer_smoke)

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CI_RUST_TOOLCHAIN }}

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Setup pnpm 10.8.0
        uses: pnpm/action-setup@v5
        with:
          version: 10.8.0
          run_install: false

      - name: Install dependencies
        run: pnpm install

      - name: Package consumer smoke
        id: package_consumer_smoke
        run: pnpm package:consumer-smoke -- --artifact-dir artifacts/consumer-smoke --skip-browser

      - name: Validate consumer smoke report
        if: always()
        env:
          EXPECT_STATUS: ${{ steps.package_consumer_smoke.outcome == 'success' && 'passed' || 'failed' }}
        run: pnpm validate:consumer-smoke-report -- --expect-status "$EXPECT_STATUS" --allow-skipped-browser

      - name: Upload consumer smoke artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: consumer-smoke-artifacts
          path: artifacts/consumer-smoke
          if-no-files-found: ignore
